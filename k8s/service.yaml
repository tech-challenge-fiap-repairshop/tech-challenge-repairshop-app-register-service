apiVersion: v1
kind: Service
metadata:
  name: register-service
  namespace: repairshop
  labels:
    app: register-service
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
spec:
  selector:
    app: register-service
  ports:
    - name: http
      port: 8081
      targetPort: 8081
  type: LoadBalancer
