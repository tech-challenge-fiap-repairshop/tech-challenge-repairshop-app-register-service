spring.application.name=register-service
server.port=${SERVER_PORT:8081}

# Graceful Shutdown
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Logging Pattern (W3C OpenTelemetry Correlation)
logging.pattern.level=%5p [${spring.application.name:},%X{trace_id:-},%X{span_id:-}]

# Datasource PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/repairshop}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:repairshop}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:repairshop}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway Migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Redis Cache (Login Sessions & JWT)
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

# JWT Secret
jwt.secret=${JWT_SECRET:dev-only-secret-key-that-must-be-changed-in-production-at-least-256-bits}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Comunicação Síncrona com Service Order Execution Service
repairshop.service-order.url=${SERVICE_ORDER_SERVICE_URL:http://localhost:8080}

# Actuator & Probes K8s (PF-11)
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.probes.enabled=true

# Readiness Probe Group (valida tráfego e dependências síncronas essenciais)
management.endpoint.health.group.readiness.include=readinessState,db

# Liveness Probe Group (Self-Healing K8s)
management.endpoint.health.group.liveness.include=livenessState,sqsListener

# SQS Health Check Parameters (PF-11)
register.sqs.health-check.enabled=${SQS_HEALTH_CHECK_ENABLED:true}
register.sqs.health-check.max-idle-seconds=${SQS_HEALTH_CHECK_MAX_IDLE:120}

# SpringDoc OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
